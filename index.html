    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; font-family: system-ui, -apple-system, sans-serif; color: #f0f0f0; line-height: 1.6; padding: 1rem; }
        .container { max-width: 1100px; margin: 0 auto; background: #1e1e1e; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        header { background: #2a2a2a; padding: 1.5rem 2rem; border-bottom: 3px solid #f5b042; }
        .header-brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; gap: 2rem; }
        .header-logo { width: 180px; height: auto; border-radius: 10px; }
        header h1 { font-size: 2rem; letter-spacing: 1px; margin: 0; }
        header h1 span { color: #f5b042; }

        /* ========== SLIDER CSS ========== */
        .slider-box {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            background: #1a1a1a;
            border-bottom: 2px solid #f5b042;
        }
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }
        .slider-track img {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: #f5b042;
            border: 1px solid #f5b042;
            font-size: 22px;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 50%;
            z-index: 10;
            transition: 0.3s;
        }
        .slider-arrow:hover {
            background: #f5b042;
            color: #1e1e1e;
        }
        .slider-arrow.left { left: 20px; }
        .slider-arrow.right { right: 20px; }
        .slider-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .slider-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 0 5px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            cursor: pointer;
        }
        .slider-dots span.active {
            background: #f5b042;
        }
        /* ========== SLIDER CSS SON ========== */

        nav ul { display: flex; flex-wrap: wrap; gap: 0.6rem; list-style: none; padding: 1rem 2rem 0 2rem; background: #1e1e1e; }
        nav button { background: #333; border: none; color: white; padding: 0.7rem 1.4rem; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        nav button.active, nav button:hover { background: #f5b042; color: #1e1e1e; }
        main { padding: 2rem 2.5rem; min-height: 55vh; }
        .content-body h2 { color: #f5b042; border-left: 5px solid #f5b042; padding-left: 1rem; margin: 0 0 1rem; text-transform: uppercase; }
        .content-body h3 { color: #f5b042; margin: 1.5rem 0 0.8rem; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .content-body p { margin-bottom: 1.2rem; color: #ccc; text-align: justify; }
        .content-body ul { margin-left: 1.5rem; margin-bottom: 1.5rem; color: #ccc; }
        .content-body li { margin-bottom: 0.7rem; }
        details.accordion { background: #252525; margin: 1rem 0; border-radius: 12px; border: 1px solid #3a3a3a; }
        details.accordion summary { padding: 1.2rem; cursor: pointer; font-weight: bold; color: #f5b042; list-style: none; display: flex; justify-content: space-between; }
        details.accordion summary::after { content: "▼"; font-size: 0.8rem; opacity: 0.7; }
        details.accordion[open] summary::after { content: "▲"; }
        .accordion-inner { padding: 1.5rem; border-top: 1px solid #3a3a3a; background: #1e1e1e; }
        .contact-link { color: #f5b042; text-decoration: none; font-weight: bold; }
        footer { text-align: center; padding: 2.5rem; background: #2a2a2a; border-top: 1px solid #333; }
        .footer-slogan { color: #666; font-style: italic; font-size: 1rem; margin-bottom: 0.5rem; display: block; }
        .footer-copy { color: #666; font-size: 0.85rem; }

        /* Ustalara Saygı - YATAY 4 SÜTUN */

            padding: 2rem 1.8rem;

        }

            margin: 0 auto 2rem auto;

            font-size: 1.6rem;

        }
        .vefa-ust-metin p {
            font-style: italic;
            color: #bbb;
        }
        .vefa-izgara {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }
        .vefa-kategori h4 {
            color: #f5b042;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        .vefa-liste {
            list-style: none;
            padding: 0;
        }
        .vefa-liste li {
            color: #eee;

            margin-bottom: 5px;
        }

        @media (max-width: 700px) {

            .vefa-izgara { grid-template-columns: repeat(2, 1fr); }
            main { padding: 1.5rem; }
            header h1 { font-size: 1.5rem; }
        }
        @media (max-width: 500px) {
            .vefa-izgara { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="slider-box" id="heroSlider">

<script>
    /* ============================================
       SLIDER (ATLIKARINCA) JS
    ============================================ */
    (function() {
        var track = document.getElementById("heroTrack");
        var dots = document.getElementById("heroDots");
        if (!track || !dots) return;

        var images = [
            "img/nihat-keles-cocuk-gelisimi-uzmani.png.png",
            "img/nihat-keles-drama-hocam.png.png",
            "img/nihat-keles-tiyatro-oyun-yazari.png.png",
            "img/nihat-keles-set.png.png",
            "img/nihat-keles-egitmen.png.png"
        ];

        var current = 0;

        for (var i = 0; i < images.length; i++) {
            var img = document.createElement("img");
            img.src = images[i];
            img.alt = "Nihat Keleş";
            track.appendChild(img);

            var dot = document.createElement("span");
            if (i === 0) dot.className = "active";
            dot.onclick = (function(idx) { return function() { goTo(idx); }; })(i);
            dots.appendChild(dot);
        }

        function goTo(i) {
            current = i;
            track.style.transform = "translateX(-" + (current * 100) + "%)";
            var allDots = dots.querySelectorAll("span");
            for (var d = 0; d < allDots.length; d++) {
                allDots[d].className = (d === i) ? "active" : "";
            }
        }

        document.getElementById("heroPrev").onclick = function() {
            current = (current - 1 + images.length) % images.length;
            goTo(current);
        };
        document.getElementById("heroNext").onclick = function() {
            current = (current + 1) % images.length;
            goTo(current);
        };

        var box = document.getElementById("heroSlider"), startX = 0;
        box.addEventListener("touchstart", function(e) {
            startX = e.touches[0].clientX;
        });
        box.addEventListener("touchend", function(e) {
            var diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                diff > 0 ? document.getElementById("heroNext").click() : document.getElementById("heroPrev").click();
            }
        });

        goTo(0);
    })();

    /* ============================================

    const dramaData = [
        {
            baslik: "🔍 Çalışma Modelim",
            icerik: `

    let currentPage = "anasayfa";
    function render() {

        if (currentPage === "drama") {

            });

        } else {
            contentArea.innerHTML = siteData[currentPage];
        }
        window.scrollTo(0, 0);
    }
    render();
</script>
